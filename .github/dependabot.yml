version: 2
updates:
  - package-ecosystem: npm # also reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # Same idea as pnpm's minimumReleaseAge: let new releases settle first.
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
