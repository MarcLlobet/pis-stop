name: ts-only

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ts-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: MarcLlobet/ts-only@74baef771a7039ae9d6cb1a145b74cb90e948c27 # v2
