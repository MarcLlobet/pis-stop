name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA (tags can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (exact lockfile, no unapproved install scripts)
        run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in runtime dependencies
        run: pnpm audit --prod --audit-level high
      - name: TypeScript only
        run: pnpm check:ts-only
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests + coverage
        run: pnpm coverage
      - name: Crypto vectors (independent Python implementation)
        run: |
          python3 -m pip install --quiet 'cryptography>=42'
          python3 scripts/verify_vectors.py
      - name: Build
        run: pnpm build
